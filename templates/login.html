<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipTwist — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login">
<main class="login-card">
  <div class="logo">
    <div class="logo-sub">Automated Clip Engine</div>
    <div class="logo-name">ClipTwist</div>
  </div>
  {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="f"><label class="l" for="u">Utilisateur</label><input class="in" id="u" name="username" autocomplete="username" autofocus required></div>
    <div class="f"><label class="l" for="p">Mot de passe</label><input class="in" id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Se connecter</button>
  </form>
</main>
</body></html>
